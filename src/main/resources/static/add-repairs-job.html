<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>Добавяне на ремонт</title>

    <link rel="icon" href="/images/favicon.png">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div id="appHeader"></div>

<div class="main-layout"
     style="margin-top:50px;
            min-height:100vh;
            align-items:flex-start;
            padding-top:80px;
            padding-bottom:40px;">

    <div class="auth-container" style="width:650px">

        <h1>Добавяне на ремонт</h1>

        <form id="repair-form" class="register-form">

            <input
                    id="repair-name"
                    placeholder="Име на ремонта"
                    required>

            <input
                    id="start-date"
                    type="date"
                    required>
            <input
                    id="end-date"
                    type="date"
                    required>
            <button type="button" id="choose-technicians-btn">
                Избери техник
            </button>

            <div id="selected-technicians-preview"></div>

            <textarea
                    id="repair-description"
                    rows="10"
                    placeholder="Описание на ремонта..."
                    required></textarea>

            <button type="submit">
                Запази
            </button>

        </form>

    </div>

</div>
<div id="employeeTechniciansModal" class="confirm-employees-technicians hidden">

    <div class="modal-content">

        <h3>Избор на служители</h3>

        <div class="transfer-container">

            <select id="technicians" size="10"></select>

            <div class="buttons">
                <button id="moveRight" class="move-right-btn">>></button>
                <button id="moveLeft" class="move-left-btn"><<</button>
            </div>

            <select id="selectedEmployeesTechnicians" size="10"></select>

        </div>
        <div>
            <div class="footer">
                <button id="confirmEmployeesTechnicians">Избери</button>
                <button id="cancelEmployeesTechnicians">Отказ</button>
            </div>
        </div>
    </div>
            <script type="module" src="/js/pages/add-repairs-job.js"></script>

</body>
</html>
